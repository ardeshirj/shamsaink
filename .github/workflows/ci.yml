# Every push (docs/TESTING.md, section 1), on arm64 runners: the same architecture as the Mac the simulator's references
# are drawn on (2026-11-06: ubuntu-24.04-arm starts for this private repository, an Arm Neoverse-N2).
#   check  make check (reader/scripts/check.sh): gofmt, vet, the tests that need no engine; a minute
#   test   the engine built (cached: rebuilt only when engine/ changes), make test (every Go test, the renders compared
#          with the kept ones), and the simulated Kobo's scenarios on public books (make e2e-sim's run.sh); a failure's
#          folder (step, log, screen, reference, difference) attached to the run
#   release  on a pushed version tag only, after both: the Kobo's and the Kindle's packages built and published as a GitHub release
#          (CHANGELOG.md, "How to release")
# On public books, each fetched and checked by its SHA-256: readalong-granularity and the walk on Moby-Dick (IDPF's
# sample), the walk and basics on Buried Alive (FarsiEPUB's narrated sample, 2026-11-06). basics' pages are held against
# their SHA-256 in e2e/refs.sum (docs/TESTING.md, section 4); a page that differs is attached as failure/screen.pgm.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: reader/go.mod
          cache-dependency-path: reader/go.sum
      - name: gofmt, vet, the tests that need no engine (reader/scripts/check.sh, the same as make check)
        run: sh reader/scripts/check.sh

  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: reader/go.mod
          cache-dependency-path: reader/go.sum
      - name: Rust 1.95 (as the eink-rust image)
        run: rustup toolchain install 1.95 --profile minimal && rustup default 1.95
      - name: the engine's build, cached by everything it is built from
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/blitz
            engine/target
          key: engine-arm64-${{ hashFiles('engine/Cargo.toml', 'engine/Cargo.lock', 'engine/fetch-blitz.sh', 'engine/patches/**', 'engine/src/**') }}
          restore-keys: engine-arm64-
      - name: Blitz at its pinned commit, with our patches
        run: engine/fetch-blitz.sh
      - name: go-toolkit, trimmed (reader/go.mod points at it)
        run: sh experiments/02-crengine-go/trim-gotoolkit.sh
      - name: the engine
        working-directory: engine
        run: cargo build --release --features parallel --lib
      - name: make test (every Go test with the engine, the renders compared with the kept ones)
        working-directory: reader
        run: FONTS=$PWD/fonts go test -count=1 -tags blitz ./...
      - name: the simulated Kobo, the scenarios on public books
        run: |
          sudo mkdir /sim && sudo chown "$(id -u):$(id -g)" /sim
          mkdir -p out/sim-books
          sh e2e/sim/run.sh out/sim-books e2e/scenarios/readalong-granularity.txt e2e/scenarios/walk-moby-dick.txt \
            e2e/scenarios/walk.txt e2e/scenarios/basics.txt
      - name: a failed scenario's folder
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure
          path: |
            e2e/out/sim/*/failure/
            /sim/mnt/onboard/.adds/shamsaink/logs/reader.log
          if-no-files-found: ignore

  # A pushed version tag (vX.Y.Z, made with make tag; CHANGELOG.md), once check and test pass: the reader built for the
  # devices as on the Mac (reader/scripts/build-armv7.sh, here without the eink-rust image: the same Rust, zig and Go),
  # packed for the Kobo and the Kindle (reader/scripts/package.sh) and published as a GitHub release with checksums. Its notes: the version's section of
  # CHANGELOG.md, else the tag's message. Before 1.0 and with a suffix (-beta) a pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, for the commits since the last one
      - name: the tag's message, kept (checkout fetches the tag as a plain ref)
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/setup-go@v6
        with:
          go-version-file: reader/go.mod
          cache-dependency-path: reader/go.sum
      - name: Rust 1.95 with the 32-bit ARM target (as the eink-rust image)
        run: |
          rustup toolchain install 1.95 --profile minimal --target armv7-unknown-linux-musleabihf
          rustup default 1.95
      - name: zig 0.15.2 (as the eink-rust image), the C compiler and linker for ARM
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-aarch64-linux-0.15.2.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: the engine's ARM build, cached by everything it is built from
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/blitz
            engine/target
          key: engine-armv7-${{ hashFiles('engine/Cargo.toml', 'engine/Cargo.lock', 'engine/fetch-blitz.sh', 'engine/patches/**', 'engine/src/**') }}
          restore-keys: engine-armv7-
      - name: Blitz at its pinned commit, with our patches
        run: engine/fetch-blitz.sh
      - name: go-toolkit, trimmed (reader/go.mod points at it)
        run: sh experiments/02-crengine-go/trim-gotoolkit.sh
      - name: the reader, static ARMv7 (reader/scripts/build-armv7.sh)
        run: VERSION="$GITHUB_REF_NAME" sh reader/scripts/build-armv7.sh
      - name: the getting-started guide (reader/scripts/welcome.sh, pandoc in Docker)
        run: sh reader/scripts/welcome.sh
      - name: the Kobo's and the Kindle's packages and their checksums (reader/scripts/package.sh)
        run: |
          VERSION="$GITHUB_REF_NAME" sh reader/scripts/package.sh
          VERSION="$GITHUB_REF_NAME" BRAND=kindle sh reader/scripts/package.sh
      - name: the release, on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          case "$v" in 0.*|*-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" out/release/shamsaink-"$GITHUB_REF_NAME"-kobo.tgz \
            out/release/shamsaink-"$GITHUB_REF_NAME"-kobo.tgz.sha256 \
            out/release/shamsaink-"$GITHUB_REF_NAME"-kindle.tgz \
            out/release/shamsaink-"$GITHUB_REF_NAME"-kindle.tgz.sha256 \
            --title "ShamsaInk $v" --notes-file notes.md $pre --verify-tag
