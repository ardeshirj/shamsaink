# What is checked on every push without the Rust engine and without a device: the code formatted (all of reader/), vetted
# (the design package and the device layer), and the design system's tests (docs/design-system.md): the spec held against the
# templates, the stylesheet, the words and the icons; the flow; the generated files (ui.css's variables, tokens_gen.go and
# docs/design/system.html) fresh; the settings' choices the code's. NOT here: the renders (make design), the ui package and
# the reader itself, which need the engine's library built with Rust; they run on the Mac, and the device walks on the Kobo.
name: CI
on:
  push:
  pull_request:
jobs:
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: reader/go.mod
          cache-dependency-path: reader/go.sum
      - name: gofmt
        working-directory: reader
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: reader
        run: go vet ./design/... ./device/...
      - name: spec, generated files, flow
        working-directory: reader
        run: go test -count=1 ./design/...
