# Every push, without the Rust engine and without a device: reader/scripts/check.sh, the same as make check (docs/testing.md,
# section 1): gofmt, vet, and the tests of every package that needs no engine: the design spec against the templates, the
# stylesheet, the words, the icons and the generated files; the device layer; devtest's scenarios and walk plan; the
# library. Not here yet: make test (the reader's own tests, reader/ui, the renders) and make e2e-sim, which need the
# engine built with Rust.
name: CI
on:
  push:
  pull_request:
jobs:
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: reader/go.mod
          cache-dependency-path: reader/go.sum
      - name: gofmt, vet, the tests that need no engine (reader/scripts/check.sh, the same as make check)
        run: sh reader/scripts/check.sh
