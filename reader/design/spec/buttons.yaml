# The page buttons (from the first browser sketch, git `e4ba57e`, docs/design/sketches): forward is the lower button whichever way the device is
# held (the accelerometer says which). A press acts at once; a hold is 1000 ms (device/touch.go). Each screen names one map
# of these (`buttons:`); a device whose profile has page buttons must have a map on every screen.
maps:
  reading:
    forward: Next page            # acts when the button is let go, so that a hold is not a press first
    back: Previous page
    hold_forward: The next chapter (the way back is the dock's Back); the dock is by touch only for now
    hold_back: The previous chapter (the glance, while held, when it is built)
  ring:        # the dock and the panels: the controls on a ring
    forward: Ring to the next control
    back: Ring to the previous control
    hold_forward: Choose it (on a slider or stepper, one step up)
    hold_back: Back out a level (on a slider, one step down)
  list:        # Contents
    forward: Ring down the list (past the end, the next page of it)
    back: Ring up the list
    hold_forward: Go there
    hold_back: Back to the page
  listening:   # while the narration plays
    forward: Next page (the voice follows)
    back: Previous page
    hold_forward: Pause or play
    hold_back: A sentence back
  word-held:   # a word held on the page
    forward: Selection one word longer
    back: One word shorter
    hold_forward: Highlight
    hold_back: Cancel
  none:        # a screen shown for a moment, left by itself (the opening screens)
    forward: Nothing, the screen is left when the work is done
    back: Nothing
    hold_forward: Nothing
    hold_back: Nothing
