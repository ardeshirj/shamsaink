name: catalogue-filters
layer: panel
templates: [catalogue-filters.html]
buttons: panel
status: built
english: true   # the library: English only, its words in en.json alone
purpose: "A catalogue's Browse and filter (2026-11-23), in the list's place under the bar, opened by the funnel at the head's end; paged as a list when long (no scrolling on e-ink). Only what the catalogue can answer (principles.yaml): its sections and its facets (later its search, and our own filters only when the whole catalogue is on one page). Its title, Browse with no facets and Browse and filter with them, with Clear all (a section or a facet in force) and a close; then the catalogue's front-page sections as Browse, the one the list is under chosen, then each group of the feed's facets (OPDS 1, their facetGroup): its name and what is chosen, what is in force a chip each under the title on every page (a section's final pick below a front page's, no x; each facet chosen, its x back to its group's first), the sections as rows ticked (one place at a time), the facets' choices as chips, the chosen one filled (as the catalogue marks it; marking none, the one followed last alone), how many books when the feed says, a long group's first eight and More…, which opens that group alone (the back arrow and its name in the title), a row each, paged. A tap follows that choice's link at once and the panel stays, Loading… in its title, until the new feed's choices come; the panel stays as it was while the feed is read, its choices not taken until the new ones come (Close, Clear all and the back arrow are). A section's link does not always say whether it leads to books or to more sections (Ebooksgratuits' are plain application/atom+xml): it is read when tapped, and no chip is marked for it (a › shown only once known, after a visit, read as \"visited\", 2026-11-23). A section holding sections and no books (Authors, Categories) is shown as its own list, a row each, its title and the back arrow above (the way up a level); a level below a section has no back arrow: Browse's heading names the final pick (an author, not Authors), its section's chip filled is the way back to its list (2026-11-23). Show N books at the foot (Done when the feed gives no number) closes it, to the list of the level chosen (the same level: on the page it was left on)."
enter: [{gesture: tap, control: catalogue-filter, from: catalogue}, {gesture: tap, control: catalogue-sections, from: catalogue}]
words: [filters-filter, filters-browse, filters-clear, filters-done, filters-show, filters-show-one, filters-more]
controls:
  - {id: filter-, component: chip, action: act, does: "follows that choice's link: a section opens, a facet applies; the panel stays with the new feed's choices; More… shows the rest of its group", dynamic: true}
  - {id: picked-, component: chip, action: act, does: "a facet's: removes it (its group's first choice, as the catalogue links it); the section's: none (changed in Browse)", dynamic: true, when: "something in force"}
  - {id: filters-clear, component: button, action: act, does: "Browse's: back to the catalogue's main page; Filter's: the level's facets off, its section kept", when: "Browse's: a section or a facet in force; Filter's: a facet"}
  - {id: filters-back, component: icon-button, action: act, does: "from a group opened by More… back to all the groups; from a section's list (Authors' letters), up a level", when: "a group or a section's list is open"}
  - {id: list-prev, component: icon-button, action: act, does: the previous page}
  - {id: list-next, component: icon-button, action: act, does: the next page}
  - {id: filters-close, component: icon-button, action: goto, to: catalogue}
  - {id: filters-show, component: button, action: goto, to: catalogue}
dismiss: filters-close
