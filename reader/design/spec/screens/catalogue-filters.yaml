name: catalogue-filters
layer: panel
templates: [catalogue-filters.html]
buttons: panel
status: built
english: true   # the library: English only, its words in en.json alone
purpose: "A catalogue's Browse and filter (2026-11-23), in the list's place under the bar, opened by the funnel at the head's end; paged as a list when long (no scrolling on e-ink). Only what the catalogue can answer (principles.yaml): its sections and its facets (later its search, and our own filters only when the whole catalogue is on one page). Its title, Browse with no facets and Browse and filter with them, with Clear all (a section or a facet in force) and a close; then the catalogue's front-page sections as Browse, the one the list is under chosen, then each group of the feed's facets (OPDS 1, their facetGroup): its name and what is chosen, its choices as chips, the chosen one filled, how many books when the feed says, a long group's first eight and More…, which opens that group alone (the back arrow and its name in the title), a row each, paged. A tap follows that choice's link at once and the panel stays, Loading… in its title, until the new feed's choices come; a tap while a choice's feed is read follows the newer choice (the older read dropped). A section's link does not always say whether it leads to books or to more sections (Ebooksgratuits' are plain application/atom+xml): it is read when tapped, and › marks one only when that is known (its kind=navigation, or read before). A section holding sections and no books (Authors, Categories) is shown as its own list, a row each, its title and the back arrow above (the way up a level); a level below a section has its title and the back arrow too. Show N books at the foot (Done when the feed gives no number) closes it, to the list of the level chosen (the same level: on the page it was left on)."
enter: [{gesture: tap, control: catalogue-filter, from: catalogue}]
words: [filters-title, filters-browse, filters-clear, filters-done, filters-show, filters-show-one, filters-more]
controls:
  - {id: filter-, component: segments, action: act, does: "follows that choice's link: a section opens, a facet applies; the panel stays with the new feed's choices; More… shows the rest of its group", dynamic: true}
  - {id: filters-clear, component: button, action: act, does: "back to the catalogue's main page with no section or facet", when: "a section or a facet is in force"}
  - {id: filters-back, component: icon-button, action: act, does: "from a group opened by More… back to all the groups; from a level below a section, up a level", when: "a group is open, or below a section"}
  - {id: list-prev, component: icon-button, action: act, does: the previous page}
  - {id: list-next, component: icon-button, action: act, does: the next page}
  - {id: filters-close, component: icon-button, action: goto, to: catalogue}
  - {id: filters-show, component: button, action: goto, to: catalogue}
dismiss: filters-close
