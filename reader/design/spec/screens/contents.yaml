name: contents
layer: screen
templates: [contents-head.html, contents.html]
buttons: list
status: built
purpose: The book's table of contents as a list, the current entry marked; a tap on an entry goes there.
enter: [{gesture: tap, control: contents, from: dock}]
controls:
  - {id: contents-close, component: icon-button, action: goto, to: reading}
  - {id: e, component: list-row, action: goto, to: reading, dynamic: true}   # e0, e1, ...; leaves "back to page N" in the dock
dismiss: contents-close
