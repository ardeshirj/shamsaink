name: catalogue
layer: screen
templates: [topbar.html, catalogue-head.html, catalogue.html, pager.html]
buttons: list
status: built
planned: [funnel, section-chosen, filtered, no-match, no-funnel]   # 2026-11-23: the funnel and Browse and filter, not wired
english: true   # the library: English only, its words in en.json alone
purpose: "The library's Catalogues side (OPDS; FarsiEPUB's built in, others from a file over USB): under the bar the catalogue shown, a button that opens the choice of catalogues, and in a section the section shown as a second such button, which opens the way back up and the catalogue's own sections; its sections (an OPDS catalogue's menus: by author, an author...) a row each ending in a \u203a, then its books a row each, as the library's, each ending in what can be done with it: a download button, its per cent while it downloads (going on when you switch away), then Read, which opens it (the book is in the Library too; one downloaded before shows Read at once). Loading… at the head's end while a page is read (the last list kept and shown at once, then refreshed only if it changed), that it could not be reached with Try again, or that it has no books; More books under the last row when the catalogue has more pages. Planned (2026-11-23): the catalogue's button alone, its name only, \"Catalogue\" before it as a setting's name (the dropdown's label); the second dropdown gone into catalogue-filters as Browse; a funnel at the head's end opening catalogue-filters, only when the catalogue has something to choose (none: FarsiEPUB's one page), filled when a section or a facet is in force, with how many when a facet is among them; no books with them: that, and Clear filters. Wi-Fi asked for when it is off (wifi-ask), and turned off again once the catalogues are left and no download goes on; a download that failed is a notice."
enter: [{gesture: tap, control: shelf-catalogues, from: library}]
words: [catalogues, catalogue-count, catalogue-loading, catalogue-unreachable, catalogue-empty, catalogue-read, catalogue-retry, catalogue-more, catalogue-label, catalogue-no-match, catalogue-clear-filters]
controls:
  - {id: topbar-phones, component: icon-button, action: goto, to: sound, requires: [sound]}
  - {id: topbar-light, component: icon-button, action: goto, to: light}
  - {id: topbar-battery, component: button, action: goto, to: battery}
  - {id: topbar-menu, component: icon-button, action: goto, to: menu}
  - {id: shelf-library, component: segments, action: goto, to: library}
  - {id: shelf-catalogues, component: segments, action: goto, to: shelf-name}
  - {id: catalogue-section, component: button, action: goto, to: catalogue-section-menu, when: "in a section"}
  - {id: catalogue-choose, component: dropdown, action: goto, to: catalogue-menu}
  - {id: catalogue-more, component: button, action: act, does: "the catalogue's next page of books, after the last row", when: "the catalogue has more pages"}
  - {id: catalogue-retry, component: button, action: act, does: "reads the catalogue's page again", when: "it could not be reached"}
  - {id: catalogue-filter, component: icon-button, action: goto, to: catalogue-filters, when: "planned, 2026-11-23: the catalogue has sections, facets, a search or is whole on one page (Only what the catalogue can answer); none of these, no funnel"}
  - {id: catalogue-clear-all, component: button, action: act, does: "back to the catalogue's main page with no facets (planned)", when: "no books with the facets in force"}
  - {id: list-prev, component: icon-button, action: act, does: the previous page of rows}
  - {id: list-next, component: icon-button, action: act, does: the next page of rows}
  - {id: e, component: list-row, action: act, does: "a section: opens it (its sections and books, the same list); a book, its button: downloads it; once it is here, opens it", dynamic: true}
dismiss: shelf-library   # the bar's choice, back to the books on the device
