name: library-book-menu
layer: overlay
templates: [library-book-menu.html]
buttons: ring
status: built
purpose: "A book's menu, opened by a finger held on its row: mark finished, mark new, details, remove."
enter: [{gesture: hold-row, from: library}]
controls:
  - {id: book-finish, component: menu-item, action: act, does: marks the book finished, when: "the book is not finished", emits: "library: .* marked finished", walk: "never: a finished book leaves the Reading list, so its menu is not a hold away (a scenario)"}
  - {id: book-new, component: menu-item, action: act, does: "forgets the place, keeps the highlights", when: "the book was opened", emits: "library: .* marked new", walk: "never: forgets the place, so the book opens at its start"}
  - {id: book-details, component: menu-item, action: replace, to: library-book-details}
  - {id: book-remove, component: menu-item, action: replace, to: library-book-remove}
dismiss: tap-outside
