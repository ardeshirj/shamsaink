name: notice
layer: overlay
templates: [notice.html]
buttons: panel
status: built
purpose: "A notice in the middle of the screen, the dialog component with a sentence and Close; any tap closes it. Listen's where the device has no player of ours yet (the Kindle): Listening is not possible on this device. Wi-Fi's: not on this device yet (the Kindle), no network saved (join one once in the device's Wi-Fi settings), no address in 20 s (try again later); the last two, failures, with a crossed-out Wi-Fi before the sentence (2026-11-20). Updates' (roadmap step 2, designed 2026-11-20; no Latin name or version inside a sentence, a version on a grey line of its own): up to date (the version under it); not on this device yet (the Kindle); the update server not reached, the download cut, the download not verified (a warning before the sentence: nothing was changed); the update undone (a counter-clockwise arrow: the new version did not start, the previous one put back)."
enter: [{gesture: no-player, from: dock}, {gesture: wifi-failed, from: library-developer}, {gesture: update-result, from: library-settings}]
internal: [notice-box]
controls:
  - {id: notice-close, component: button, action: act, does: closes the notice}
dismiss: tap-outside
words: [listen-not-here, wifi-not-here, wifi-no-network, wifi-no-address, update-none, update-not-here, update-unreachable, update-cut, update-unverified, update-undone, close]
