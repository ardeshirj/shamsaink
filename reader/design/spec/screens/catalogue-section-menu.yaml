name: catalogue-section-menu
layer: panel
templates: [catalogue-menu.html]
buttons: panel
status: built
english: true   # the library: English only, its words in en.json alone
purpose: "The choice of sections, under the section shown (the catalogues' second button, in a section; 2026-11-22: in place of a back button): the catalogue's own sections, the one the list is under ticked; the ticked one goes back to it as it was left (its page, no read), another opens it. Not listed: the levels in between (at two levels they were the sections again), nor the main page (the catalogue chosen again in its menu goes back to it)."
enter: [{gesture: tap, control: catalogue-section, from: catalogue}]
controls:
  - {id: catalogue-top-, component: menu-item, action: act, does: "the section the list is under: back to it as it was left; another: opens it", dynamic: true}
dismiss: tap-outside
