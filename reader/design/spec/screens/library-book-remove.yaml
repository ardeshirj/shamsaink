name: library-book-remove
layer: overlay
templates: [library-book-remove.html]
buttons: ring
status: built
purpose: "Asks before a book is removed: what is removed, then Remove and Keep. Removing deletes the file and all the reader keeps for it."
enter: [{gesture: tap, control: book-remove, from: library-book-menu}]
controls:
  - {id: book-remove-yes, component: button, action: act, does: "deletes the book's file and what the reader keeps for it"}
  - {id: book-remove-no, component: button, action: act, does: keeps the book}
dismiss: tap-outside
