name: highlight-menu
layer: overlay
templates: [highlight-menu.html]
buttons: word-held
status: built
purpose: "By the words chosen (a finger held on a word, dragged and lifted) or a highlight held: Highlight or Remove highlight, and Listen from here in a narrated book. Hangs under the words, over them when there is no room."
enter: [{gesture: hold-word, from: reading}]
controls:
  - {id: hl-make, component: menu-item, action: act, does: highlights the words chosen, when: "words are chosen"}
  - {id: hl-remove, component: menu-item, action: act, does: removes the highlight held, when: "a highlight is held"}
  - {id: hl-listen, component: menu-item, action: act, does: starts the narration from the word, when: "the book is narrated"}
dismiss: tap-outside
