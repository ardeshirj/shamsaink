name: library
layer: screen
templates: [topbar.html, library.html, library-head.html, pager.html, library-tiles.html]
buttons: list
status: built
english: true   # the library: English only, its words in en.json alone
entry: true          # where the app starts
purpose: "The books as tiles (2026-11-23, in place of a row each), three a row and two rows a page, under the bar (its title the choice of Library and Catalogues, Library chosen) and the filters (Reading, New, Finished, All) with a sort button. Each tile a cover made of the book's own words, title, author and the year its dc:date starts with when it gives one, centred in the book's own direction on plain paper; under it, in New and Finished, when it was added or finished. In the cover's corners, the frame's whatever the book's direction: the headphones top left (narrated); top right the book's state as one ring filled clockwise from the top, so nothing has a direction to mirror: empty when new (never opened, or marked new, which sends it back to its start), a wedge when opened (at least 5%, so an opened book is never an empty ring), a ringed check when finished. New books are marked in every filter but New, so All shows them. The grid runs left to right, as the frame. With no books in the filter chosen, one placeholder: No books here; when there are no books at all, also the folder on the device's drive that EPUB books go in."
enter: [{gesture: tap, control: topbar-start, from: topbar}]
words: [no-books, no-books-hint, catalogues]
controls:
  - {id: topbar-phones, component: icon-button, action: goto, to: sound, requires: [sound]}
  - {id: topbar-light, component: icon-button, action: goto, to: light}
  - {id: topbar-battery, component: button, action: goto, to: battery}
  - {id: topbar-menu, component: icon-button, action: goto, to: menu}
  - {id: shelf-library, component: segments, action: goto, to: shelf-name}
  - {id: shelf-catalogues, component: segments, action: goto, to: catalogue, walk: "never: needs the network (Wi-Fi asked for when off, the catalogue read): on the devices, e2e/scenarios/catalogue.txt"}
  - {id: filter-, component: segments, action: act, does: "shows the books of a filter (reading, new, finished, all)", values: [reading, new, finished, all], dynamic: true}
  - {id: list-sort, component: icon-button, action: goto, to: library-sort}
  - {id: list-prev, component: icon-button, action: act, does: the previous page of rows}
  - {id: list-next, component: icon-button, action: act, does: the next page of rows}
  - {id: e, component: list-row, action: goto, to: reading, dynamic: true}   # a tap opens the book (a finished one at its start, Reading again); a hold opens its menu
