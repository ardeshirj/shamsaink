# What the design stands on, from the first browser sketch (2026-10-30; git `e4ba57e`, docs/design/sketches). `check` says what enforces it: a check of
# `go test ./design` or `make test`, or "by eye" when only a person can judge it.
principles:
  - name: The page alone
    text: "No clock, no bar, no ticking while reading: the reader sleeps until a touch or a button."
    check: "by eye (the reading screen has no controls: checked)"
  - name: Controls come to the hand
    text: "The dock at the bottom; the glance beside the finger; in landscape, at the grip."
    check: by eye
  - name: What the device has, only
    text: "Light where there is a light, Listen where there is sound, colour on colour screens: a control the device lacks is not drawn, never greyed out. What the book lacks is another thing: Listen in a book with no narration is shown light, not a button, so the tools keep their places and the feature is seen to exist. And what is not built yet on a device that has the hardware (the Kindle's sound, 2026-11-06) is drawn, and a notice says it is not there yet."
    check: "a control's `requires` is a capability, and CheckControls leaves it out of a device that lacks it (TestRequires); the light Listen is by eye"
  - name: Everything by buttons too
    text: "The page buttons reach every control, for devices and people that need them."
    check: "every screen has a page-button map when the device has page buttons"
  - name: The same bar everywhere
    text: "The library's header and the book's bar are one component in one place: the way back or search at the start, the device's time, light and battery at the end."
    check: "both screens are made from topbar.html (template check)"
  - name: Refresh what changed
    text: "Each layer its own box and waveform; black and white controls, no shadows, greys or motion. Smooth by default: no flash on a page turn or a panel; a wake from sleep flashes white, then the page, so the sleep screen does not stay behind the text."
    check: "every component names a waveform the device has and a region"
  - name: The interface's frame, the content's direction
    text: "The frame of a screen (the order of things in a row, icons, controls, where a bar or a tag sits) follows the interface's language: English left to right, Farsi right to left, never mirrored for what is shown in it. Each piece of content (a book's title and author, a chapter's name) takes its own direction, from the language its book declares, else its first strong letter; it is isolated from what is around it and aligned by its own direction inside the frame. A book's own parts keep its direction: its pages and page turns, its contents (one book's list, in its language), what shows its progress (its bar filled from the book's start). In the library a Farsi title reads from the right and its bar sits in the same column as an English one's (2026-11-23; as W3C's guidance on bidirectional text and Unicode's bidi algorithm, UAX #9)."
    check: "by eye (the library's renders: a mixed shelf, its bars in one column)"
rules:
  - name: Out is the page
    text: "A tap on the page, Done, a close button or a jump: each closes everything at once and leaves the page alone, one refresh."
    check: "a screen's dismiss is a tap off it or a control going to the page or back to where it came from"
  - name: A panel closes to where it came from
    text: "A tap outside a panel closes the panel and leaves the bar and dock it was opened from; a second tap on the page closes those. (Decided 2026-11-01 after use: kept, it saves a tap when moving between Light and Text.)"
    check: "by eye (the device walk closes Light, then uses the bar)"
  - name: A control says what it is
    text: "A control whose value alone does not say what it sets has its name at the start of its line, regular, in the ink's colour, the control after it with its value regular (a setting's row: Sleep after, Follow book language; a labelled dropdown: Catalogue). Neither is bold; the control's border marks what is tapped. One under a heading, or whose value says it, has no name. As Apple's settings rows, Material's list items and WCAG's labels (2.4.6, 3.3.2): a name that stays, not a placeholder (2026-11-23)."
    check: "by eye (the samples of the dropdown, stepper and toggle on the page)"
  - name: A book is its own cover
    text: "The library shows books as tiles, three a row and two rows a page, not rows (2026-11-23), each the shape of a book (2 by 3): its cover picture shown whole when it has one (made small once, when the book is added, never decoded as it is shown), else a cover of its own words (title, author, the year when it gives one) centred in its own direction, so books of both directions sit side by side with no column to share; its type a printed cover's, the title's size by its length (short ones large, long ones smaller so they fit), in a thin frame inside its edge (2026-11-24, after a cover of small words in a large box looked bare). Nothing on a tile: what it is and where the reader is with it (the share read, narrated, new, finished) are in the dialog a finger held on it opens, and in the filters; marks on covers (a ring, the headphones, a halo round them) were tried and left out: the covers read cleaner. A picture is the reader's choice per book (Cover: Picture or Words in that dialog), never a rule that hides some pictures and not others. A cover is never changed by dark mode. As Kobo's, Kindle's and Apple Books' grids, and Nielsen Norman Group's advice (grids for recognising things at a glance, a few large targets on e-ink over many small ones)."
    check: "by eye (the library's renders: covers, covers-dark, a mixed shelf)"
  - name: Books as covers, words as rows
    text: "Books are shown as tiles wherever they are listed (the library, a catalogue's books, later search results): a book is recognised by its cover (A book is its own cover). Rows are for words: a book's chapters, a catalogue's Browse (its sections, authors, subjects), settings, menus. A row whose words may be in either direction carries nothing in a column shared with the other rows (a Farsi title would end before it, an English one start at the edge, the column lined up with neither); a section's › is the frame's, at the row's end. A book's state (the share read, a download under way, Read) goes under its tile or in its dialog, never in a column beside mixed titles (2026-11-23, after the library's rows). As Material's lists and image lists (text in lists, visual content in grids), Apple's Human Interface Guidelines (collections for items recognised by their image, tables for text and settings) and Nielsen Norman Group (grids to recognise at a glance, lists to scan text and details)."
    check: "by eye (the library's and the catalogue's renders: books as tiles; contents, Browse, settings and menus as rows)"
  - name: Only what the catalogue can answer
    text: "A catalogue's choices (Browse and filter) are only those it answers itself, in this order: its facets when it gives them (OPDS facets: it filters, counts and combines them); its sections, always (a link to another feed: a place, not a filter, so one is in force at most); its search when it declares one (OpenSearch, with the keyboard); and filters of our own from the books' details only when the whole catalogue is in hand (a feed with no next page), so their counts are true. Never a filter over the one page loaded, and never a meaning read from a section's title (Updates, Nouveautés): titles are shown as the catalogue wrote them. A catalogue with none of these has no funnel (2026-11-23, after reading our four catalogues' feeds: none has facets)."
    check: "by eye (the planned renders of catalogue-filters)"
  - name: Books on the catalogue's screen
    text: "A catalogue's main screen shows books, and choosing what to see is Browse and filter's (the funnel). Entered, a catalogue shows the books of the place it was added at; a front page of sections only, those of the section it marks newest (OPDS's sort/new), then featured or popular, then one whose link says it holds books, then the first of its sections that holds books (three read at most); its name in bold under the head, as a heading, not a control, so where the books come from is seen (Nielsen's first heuristic, WCAG 2.4.8). None found: the funnel's icon, Choose what to browse in this catalogue, and Browse, which opens the panel (an empty state says why and what next: Material 3, Nielsen Norman Group), never a list of sections on the main screen nor the panel opened by itself. Content first, the filters beside it, as GOV.UK's filter pattern and Apple's and Material's stores; the section as a second dropdown (Browse's place before 2026-11-23) was drawn and not chosen (2026-11-23)."
    check: "by eye (the catalogue's planned renders landing-heading and landing-choose)"
  - name: A place is a row, a filter a chip
    text: "In Browse and filter a catalogue's sections, places one at a time (a link to another list: picking one leaves the other), are rows ticked when chosen, as a menu's; its facets, filters that combine as the catalogue links them, are chips, filled when chosen. Each behind its own icon: Browse the list icon, Filter the funnel (a funnel only narrows, in Material and Apple's use alike). What is in force is a chip each under the title, on every page: on Browse below a front page's section its final pick (Austen under Authors; no x); on Filter each facet other than its group's first, with an x that goes back to that first. As Material (lists to go somewhere, filter chips to narrow, input chips to remove) and GOV.UK's selected filters; 2026-11-23, after picking a genre undid an author on Ebooksgratuits, sections as chips read as filters that combine."
    check: "by eye (catalogue-filters' renders); TestCatalogueFacetsChosen (the row and what each x removes)"
  - name: Two levels at most
    text: "The page, the bar and dock, one panel. No panel opens another; one may take another's place."
    check: "no goto from a panel or overlay to a panel or overlay; replace stays in one layer"
  - name: The device's, the book's
    text: "The bar holds what belongs to the device (time, headphones, light, battery); the dock what belongs to the book (where you are, its tools)."
    check: by eye
  - name: One icon, one meaning
    text: "Each icon means one thing everywhere (2026-11-08): play starts listening (the dock's Listen, the word menu's); headphones are the device's sound (the bar's Sound) and mark a book that can be listened to; speakers are loudness (the volume's ends); the Bluetooth glyph connects."
    check: by eye
  - name: A way back after a jump
    text: "Chapter arrows, a tap on the bar or Contents leave \"Back to page N\" in the place line until two pages are read."
    check: "by eye (dock's back control exists)"
