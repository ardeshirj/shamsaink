# The look, as values: the one place they are set. `make design-update` writes the :root of reader/ui/templates/ui.css (each
# comment here comes with its variable) and reader/ui/tokens_gen.go (the panels' sizes) from this file; a test fails when
# either is not what this makes.
css:
  --ink: black
  --paper: white
  --line: 3px          # every border
  --radius: 0.4em      # a button's corners
  --pad: 0.05em 0.6em  # inside a button
  --gap: 0.5em         # between buttons side by side, and between rows of them
  --faint: gray        # what is there but not ready (the headphones while none are connected)
panel:
  font_px: 40     # the panels' base font size (the engine's FontSize), 1em
  margin_px: 40   # around a panel's content (the engine's Margin)
# Layers, from the bottom of the stack up: what the screen is made of. A screen names the layer it lives in.
layers:
  - page         # the engine's pixels: the book, nothing else
  - screen       # a whole screen in the page's place (the library, Contents)
  - topbar       # the bar over the page's top
  - dock         # the sheet at the bottom, opened by a tap
  - panel        # hangs under the bar or over the dock (Light, Text, a menu)
  - overlay      # over everything for a moment (a word's panel, a note, the battery's level)
