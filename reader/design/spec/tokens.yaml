# The look, as values. `css` tokens are the variables of reader/ui/templates/ui.css (:root); the check in design_test.go
# fails when the two differ, so a change is made here and in ui.css together (ui.css is generated from this later).
# `px` values are read by the panels' drawing (reader/ui/panel.go).
css:
  --ink: black
  --paper: white
  --line: 3px
  --radius: 0.4em
  --pad: 0.05em 0.6em
  --gap: 0.5em
panel:
  font_px: 40     # the panels' base font size (drawPanelIn: Options.FontSize), 1em
  margin_px: 40   # around a panel's content (Options.Margin)
# Layers, from the bottom of the stack up: what the screen is made of. A screen names the layer it lives in.
layers:
  - page         # the engine's pixels: the book, nothing else
  - screen       # a whole screen in the page's place (the library, Contents)
  - topbar       # the bar over the page's top
  - dock         # the sheet at the bottom, opened by a tap
  - panel        # hangs under the bar or over the dock (Light, Text, a menu)
  - overlay      # over everything for a moment (a word's panel, a note, the battery's level)
