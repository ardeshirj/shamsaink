{{template "head" ""}}<style>
p.t { direction: {{.Dir}}; white-space: nowrap; overflow: hidden; }
/* the bar fills from the book's start side: a flex row in its direction */
div.bar { display: flex; direction: {{.Dir}}; height: 28px; margin: 0.4em 0; border: var(--line) solid var(--ink); border-radius: 14px; }
div.fill { width: {{.Width}}%; background: var(--ink); border-radius: 11px; }
</style></head><body>
<p class="t">{{.Chapter}}</p>
<p>{{.Where}}</p>
<div class="bar" id="{{id "bar"}}"><div class="fill"></div></div>
<div class="row">{{template "button" btn "contents" "Contents"}}{{template "button" btn "chapter-prev" "Previous chapter"}}{{template "button" btn "chapter-next" "Next chapter"}}{{if .Back}}{{template "button" btn "back" .Back}}{{end}}</div></body></html>
