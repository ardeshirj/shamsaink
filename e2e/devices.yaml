# How to reach and drive each device: facts of the hardware, firmware and network, not of the design. The design's facts
# about the same device (screen, ppi, waveforms, tap sizes, fonts) are in reader/design/spec/devices/; the key here is that
# profile's name. Read by reader/cmd/devtest.
kobo-libra-colour:
  ssh: kobo                                   # a host of ~/.ssh/config (docs/devices/kobo/setup.md)
  dir: /mnt/onboard/.adds/shamsaink           # where the reader is installed
  log: /mnt/onboard/.adds/shamsaink/logs/reader.log
  # the touch screen is turned: a screen point (x, y) is written as the touch point given by x and y here (w, h: the screen's
  # size), as in reader/device/screen.go, touchTurn
  touch: {node: /dev/input/event1, name: Elan Touchscreen, turn: {x: h-y, y: x}}
  framebuffer: {stride: 5056, bits: 32}       # /sys/class/graphics/fb0
  fonts_local: reader/out/fonts               # the folder the renders are drawn with; the device's must be the same files
  reader_local: reader/out/shamsaink          # the latest local build (make reader); the device's may be an older one
