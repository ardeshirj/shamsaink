[package]
name = "blitz-engine"
version = "0.1.0"
edition = "2024"

# Blitz from its repository (engine/blitz, fetched by fetch-blitz.sh at a pinned commit with patches/ applied; its
# crates.io releases lag behind), without system fonts (fontconfig, C), accessibility or the network layer: files only.
# rlib for the blitz-pages tool, staticlib for Go (cgo) through the C interface in capi.rs
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
blitz-dom = { path = "blitz/packages/blitz-dom", default-features = false, features = ["woff"] }
blitz-html = { path = "blitz/packages/blitz-html", default-features = false }
blitz-paint = { path = "blitz/packages/blitz-paint", default-features = false }
blitz-traits = { path = "blitz/packages/blitz-traits" }
parley = { version = "0.12", default-features = false, features = ["std"] }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
bytes = "1"
url = "2"
png = "0.17"
# MP3 narration decoded for read-along (pure Rust, MPL-2.0; experiment 12, step 6)
symphonia = { version = "0.5.4", default-features = false, features = ["mp3"] }
# Blitz takes the image crate with every format off, so no picture was ever decoded (found in 08): ours switch the
# common ones on (pure Rust)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# JPEGs decoded already scaled down (1/2, 1/4, 1/8), which the image crate's decoder cannot (pure Rust)
jpeg-decoder = { version = "0.3", default-features = false }
miniz_oxide = "0.8"
# glyph masks made on every core with "parallel" (already in Blitz's tree, through Stylo)
rayon = { version = "1", optional = true }

[profile.release]
strip = true

[features]
# Blitz's own timings of each step of a resolve (style, layout, ...), printed to stdout (experiment 08)
phase-times = ["blitz-dom/log-phase-times"]
# Blitz builds the paragraphs' text layouts on several threads, and ours a page's new glyph masks (rayon)
parallel = ["blitz-dom/parallel-construct", "dep:rayon"]
