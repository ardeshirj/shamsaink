[package]
name = "parley-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
# without "system" (fontconfig, C): a reader uses the book's fonts and one bundled fallback
parley = { version = "0.12", default-features = false, features = ["std"] }
# the version Parley itself uses, so its font data and ours are the same types
skrifa = "0.44"
tiny-skia = "0.12"
serde_json = "1"

[profile.release]
strip = true
